name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  backend:
    name: Backend — compile + tests légers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installer pytest
        run: pip install --quiet pytest

      # Compile TOUT le backend : attrape les erreurs de syntaxe sans exécuter
      # (pas besoin des dépendances lourdes mediapipe / google-genai / etc.).
      - name: Compilation (py_compile)
        run: python -m compileall -q backend

      # Tests sans dépendances lourdes : politique shell, cohérence des outils,
      # et les sous-systèmes cognitifs (persistance, mémoire émotionnelle, repos).
      - name: Tests légers (shell, outils, brain)
        run: |
          python -m pytest \
            tests/test_safe_exec.py \
            tests/test_tool_consistency.py \
            tests/test_emotional_memory.py \
            tests/test_idle_mind.py \
            tests/test_appraisal.py \
            tests/test_planner.py \
            tests/test_mac_routines.py \
            tests/test_action_memory.py \
            tests/test_browser_bridge.py \
            tests/test_safe_git.py \
            tests/test_mac_files.py \
            tests/test_machine_context.py \
            brain/tests/test_persistence.py \
            brain/tests/test_expectations.py \
            brain/tests/test_social_learning.py \
            brain/tests/test_circadian.py \
            brain/tests/test_user_state.py \
            brain/tests/test_decision_bias.py \
            tests/test_reliability.py \
            brain/tests/test_temperament.py \
            tests/test_correspondence.py \
            -q

  frontend:
    name: Frontend — build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Installer les dépendances
        run: npm ci || npm install

      - name: Build Vite
        run: npm run build
