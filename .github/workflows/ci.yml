name: CI

# Lance la suite de tests (backend + frontend) et le build de prod à chaque push
# et pull request sur la branche de travail. Vise à protéger les 164 tests contre
# toute régression. Dépendances backend volontairement minimales : les tests sont
# conçus sans clé ni réseau réel (stubs/monkeypatch), et les modules lourds
# (chromadb, mediapipe, torch, pyaudio…) sont importés paresseusement, donc inutiles ici.

on:
  push:
    branches: [integration/widget-pc-control, main]
  pull_request:
    branches: [integration/widget-pc-control, main]

jobs:
  backend:
    name: Tests backend (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Dépendances de test (lean)
        # numpy est requis par conftest.py et la couche vision (yolo/vision_*) ;
        # fastapi par api_auth. Les modules lourds (opencv, chromadb, torch,
        # mediapipe, ultralytics) ne sont pas importés au chargement des tests.
        run: python -m pip install --upgrade pip && pip install "pytest>=7.0" "pytest-asyncio>=0.23" "fastapi>=0.110" "numpy"
      - name: pytest
        run: python -m pytest backend/tests -q

  frontend:
    name: Tests frontend + build (vitest / vite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Installation
        run: npm ci
      - name: Tests (vitest)
        run: npm run test
      - name: Build de production
        run: npm run build
      - name: Navigateur de smoke-test (chromium)
        run: npx playwright install --with-deps chromium
      - name: Smoke-test de rendu (anti écran blanc)
        # Lance vite, attend qu'il réponde, puis vérifie que l'app rend (desktop
        # + mobile) sans erreur de page. Attrape les crashs de render (TDZ, etc.)
        # que le build et les tests unitaires ne voient pas.
        run: |
          # --host 127.0.0.1 : bind IPv4 explicite (sinon vite bind localhost/::1
          # et wait-on/smoke en 127.0.0.1 ne le voient jamais → faux timeout).
          npm run web -- --host 127.0.0.1 > /tmp/vite.log 2>&1 &
          npx wait-on -t 90000 http://127.0.0.1:5173/ || { echo "::error::vite non prêt (wait-on timeout)"; echo '--- vite.log ---'; cat /tmp/vite.log; exit 1; }
          SMOKE_URL=http://127.0.0.1:5173/ npm run smoke
